<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sfMate</title>
  <style>
    :root {
      --gold: #b27a3f; --gold-dark: #8a5d2e; --brown: #3e251b;
      --text: #2a1d16; --muted: #7d6b5d; --border: #e6ddd2;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, rgba(178, 122, 63, 0.13), transparent 70%),
        linear-gradient(160deg, #fdfbf7 0%, #f3ede5 100%);
      display: flex; flex-direction: column; min-height: 100vh;
    }

    /* Top bar: log in on the right */
    .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 14px; padding: 22px 32px; }
    .topbar a {
      font-size: 14px; font-weight: 600; color: var(--brown); text-decoration: none;
      padding: 9px 20px; border: 1.5px solid var(--border); border-radius: 999px; background: rgba(255, 255, 255, 0.7);
      transition: all .25s ease;
    }
    .topbar a:hover { border-color: var(--gold); color: var(--gold-dark); background: white; }

    /* Center: big logo, byline, sign up */
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 24px 9vh; text-align: center;
    }
    .logo {
      width: min(620px, 84vw); height: auto; display: block;
      filter: drop-shadow(0 10px 24px rgba(62, 37, 27, 0.10));
      animation: rise .9s cubic-bezier(.2, .7, .2, 1) both;
    }
    .byline {
      display: flex; align-items: center; gap: 16px; margin: 26px 0 44px;
      font-size: 13px; font-weight: 600; letter-spacing: .32em; text-transform: uppercase; color: var(--gold-dark);
      animation: rise .9s .15s cubic-bezier(.2, .7, .2, 1) both;
    }
    .byline::before, .byline::after {
      content: ""; width: 44px; height: 1px; background: linear-gradient(to right, transparent, var(--gold));
    }
    .byline::after { background: linear-gradient(to left, transparent, var(--gold)); }
    .byline span { margin-right: -.32em; }   /* letter-spacing adds trailing space; keep the text optically centered */

    .cta {
      display: inline-block; padding: 16px 52px; border-radius: 999px; text-decoration: none;
      font-size: 16px; font-weight: 600; letter-spacing: .02em; color: white; background: var(--gold);
      box-shadow: 0 10px 24px rgba(178, 122, 63, 0.28);
      transition: all .25s ease;
      animation: rise .9s .3s cubic-bezier(.2, .7, .2, 1) both;
    }
    .cta:hover { background: var(--gold-dark); transform: translateY(-2px); box-shadow: 0 14px 30px rgba(138, 93, 46, 0.32); }
    .tagline { margin: 22px 0 0; font-size: 14px; color: var(--muted); animation: rise .9s .45s cubic-bezier(.2, .7, .2, 1) both; }

    footer { text-align: center; padding: 0 24px 22px; font-size: 12px; color: var(--muted); }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    @media (max-width: 520px) {
      .topbar { padding: 16px 18px; }
      .byline { letter-spacing: .24em; font-size: 12px; }
      .cta { padding: 15px 44px; }
    }
  </style>
</head>

<script>
// Already logged in on this browser? Swap the buttons for a way straight back in.
(async function () {
  if (!location.protocol.startsWith('http')) return;   // opened as a local file: just a preview
  const token = localStorage.getItem('sfmate_session');
  if (!token) return;
  try {
    const res = await fetch(new URL('auth/me', location.href), { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) return;
    const me = await res.json();
    const target = me.setup_done ? 'app' : 'setup';
    const cta = document.getElementById('primaryCta');
    cta.textContent = 'Open the chatbot';
    cta.href = target;
    const login = document.getElementById('loginLink');
    login.textContent = me.profile?.first_name || me.name;
    login.href = target;
  } catch {}
})();
</script>
