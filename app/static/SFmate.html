  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }

  /* Header */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px; background: var(--panel); border-bottom: 2px solid var(--gold);
  }
  .logo { display: block; height: 40px; width: auto; }
  .brand { font-size: 13px; color: var(--muted); padding-left: 14px; border-left: 1px solid var(--border); }
  @media (max-width: 640px) { .brand { display: none; } }
  .spacer { flex: 1; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  .dot.ok { background: #16a34a; }
  .dot.bad { background: var(--gold); }
  .icon-btn {
    border: 1px solid var(--border); background: var(--panel); border-radius: 8px;
    padding: 7px 11px; cursor: pointer; font-size: 14px; color: var(--text);
  }
  .icon-btn:hover { background: var(--bg); }
  .user-name { font-size: 13px; font-weight: 600; color: var(--brown); }
  .user-name:empty { display: none; }
  @media (max-width: 640px) { .user-name { display: none; } }

  /* Messages */
  main { flex: 1; overflow-y: auto; }
  .thread { max-width: 780px; margin: 0 auto; padding: 24px 16px 8px; }
  .msg { display: flex; gap: 10px; margin-bottom: 18px; }
  .msg.user { justify-content: flex-end; }
  .avatar, .welcome-knight {
    flex: none; border-radius: 50%; border: 1.5px solid var(--gold);
    background-color: var(--white); background-image: var(--knight);
    background-size: 80%; background-position: center; background-repeat: no-repeat;
  }
  .avatar { width: 32px; height: 32px; margin-top: 2px; }
  .bubble {
    max-width: 85%; padding: 11px 15px; border-radius: 14px; line-height: 1.55; font-size: 15px;
    overflow-wrap: anywhere;
  }
  .user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bot .bubble p { margin: 0 0 10px; }
  .bot .bubble p:last-child { margin-bottom: 0; }
  .bot .bubble ul, .bot .bubble ol { margin: 0 0 10px; padding-left: 22px; }
  .bot .bubble code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bot .bubble a { color: var(--gold-dark); }
  .bot .bubble sup a { text-decoration: none; font-weight: 600; padding: 0 1px; }
  .bubble.error { border-color: #e9cfae; background: #fbf3e8; color: #7a4b14; }
  .waking { margin: 8px 0 0 !important; font-size: 13px; color: var(--muted); }
  .announce-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .announce-actions button {
    border-radius: 999px; padding: 7px 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    border: 1.5px solid var(--gold); background: var(--gold); color: #fff;
  }
  .announce-actions .announce-no { background: transparent; color: var(--gold-dark); border-color: var(--border); }
  .announce-actions .announce-yes:hover { background: var(--gold-dark); border-color: var(--gold-dark); }
  .announce-actions .announce-no:hover { border-color: var(--gold); }
  .announce-actions button:disabled { opacity: .45; cursor: default; }

  .sources { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 13px; }
  .sources summary { cursor: pointer; color: var(--muted); }
  .sources ul { margin: 6px 0 0; padding-left: 0; list-style: none; }
  .sources li { margin: 2px 0; }

  .typing span {
    display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%;
    background: var(--gold); animation: blink 1.2s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* Empty state */
  .welcome { text-align: center; padding: 48px 16px 16px; }
  .welcome-knight {
    width: 96px; height: 96px; margin: 0 auto 14px; border-width: 2px; background-size: 82%;
    box-shadow: 0 4px 14px rgba(62, 37, 27, .12);
  }
  .welcome h1 { margin: 0 0 6px; font-size: 26px; color: var(--brown); }
  .welcome p { margin: 0 0 22px; color: var(--muted); }
  .welcome-note {   /* the model's personalized greeting, styled like one of sfMate's chat bubbles */
    display: block; width: fit-content; max-width: 560px; margin: 4px auto 16px; padding: 11px 16px;
    background: var(--bot-bubble); border: 1px solid var(--border); border-left: 3px solid var(--gold);
    border-radius: 14px; text-align: left; font-size: 15px; line-height: 1.55; color: var(--text);
  }
  .welcome-note[hidden] { display: none; }
  .suggestions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: left; }   /* 6 tiles: 3 x 2 */
  @media (max-width: 640px) { .suggestions { grid-template-columns: repeat(2, 1fr); } }                 /* 2 x 3 */
  @media (max-width: 380px) { .suggestions { grid-template-columns: 1fr; } }
  .suggestion {
    border: 1px solid var(--border); background: var(--panel); border-radius: 12px; padding: 12px 14px;
    cursor: pointer; font-size: 14px; color: var(--text); text-align: left;
  }
  .suggestion:hover { border-color: var(--gold); }

  /* Composer */
  footer { padding: 10px 16px 18px; }
  .composer {
    max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 8px 8px 8px 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .composer:focus-within { border-color: var(--gold); }
  textarea {
    flex: 1; border: none; outline: none; resize: none; font: inherit; font-size: 15px;
    max-height: 180px; padding: 7px 0; background: transparent; color: var(--text);
  }
  #send {
    flex: none; width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer;
    background: var(--gold); color: #fff; font-size: 17px; display: grid; place-items: center;
  }
  #send:hover { background: var(--gold-dark); }
  #send:disabled { background: #d1d5db; cursor: default; }
  .disclaimer { max-width: 780px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--muted); }

  /* Settings dialog */
  dialog { border: none; border-radius: 14px; padding: 22px; width: min(460px, 92vw); box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { margin: 0 0 6px; font-size: 18px; }
  dialog p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  dialog input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }

  .primary { background: var(--gold-dark); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .primary:hover { background: var(--brown); }
</style>

  <div class="thread" id="thread"></div>
</main>

<footer>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Ask sfMate anything about Saint Francis…" autofocus></textarea>
    <button id="send" type="submit" title="Send">➤</button>
  </form>
  <div class="disclaimer">sfMate can make mistakes. Check important info with the school or the Student-Parent Handbook.</div>
</footer>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Connect to sfMate</h2>
    <p>Only needed when testing this page from a file: paste the sfMate server's URL.</p>
    <input id="apiInput" type="url" placeholder="https://…" required>
    <input id="keyInput" type="password" placeholder="Access key" required style="margin-top: 8px">
    <div class="dialog-actions">
      <button class="icon-btn" value="cancel" formnovalidate>Cancel</button>
      <button class="primary" value="save">Save &amp; connect</button>
    </div>
  </form>
</dialog>

<script>
const SUGGESTIONS = [
  "When is the next liturgy?",
  "Announcement summary",
  "What's on the menu?",
  "Upcoming events this week?",
  "When's the next school holiday?",
  "When does the grading period end?",
];
const HISTORY_TURNS = 6;   // messages of context sent with each question (server keeps the last 6 too)

const $ = (id) => document.getElementById(id);
const thread = $("thread"), scroller = $("scroller"), input = $("input"), sendBtn = $("send");

let apiBase = "", apiKey = "";
let history = [];          // [{role, content}] — what the model has seen
let controller = null;     // AbortController for the in-flight request

// ---------- backend URL + access key ----------
// Served by the sfMate server itself (http/https page): the API is the same server, nothing to configure.
// Opened as a local file: ?api=…&key=… beat localStorage, editable in ⚙️.
const SERVED_BY_BACKEND = location.protocol.startsWith("http");

// ---------- login session: set by the login page, at "/login" (this page is "/app"; "/" is the home page) ----------
const LOGIN_PAGE = new URL(".", location.href).href;
const SETUP_PAGE = new URL("setup", location.href).href;   // name / grade / hobbies, editable any time
let sessionToken = localStorage.getItem("sfmate_session") || "";
let firstName = "";   // from the setup page, if they filled it in
function goToLogin() {
  localStorage.removeItem("sfmate_session");
  location.replace(LOGIN_PAGE);
}
if (SERVED_BY_BACKEND && !sessionToken) goToLogin();

function setApi(url, key) {
  apiBase = (url || "").trim().replace(/\/+$/, "");
  apiKey = (key || "").trim();
  if (!SERVED_BY_BACKEND) {
    localStorage.setItem("sfmate_api", apiBase);
    localStorage.setItem("sfmate_key", apiKey);
  }
  checkHealth();
}
const params = new URLSearchParams(location.search);
if (SERVED_BY_BACKEND) {
  $("openSettings").hidden = true;
  setApi(new URL(".", location.href).href, params.get("key") || "");   // directory of this page, in case the proxy adds a path prefix
} else {
  setApi(params.get("api") || localStorage.getItem("sfmate_api") || "",
         params.get("key") || localStorage.getItem("sfmate_key") || "");
}

function apiHeaders(extra = {}) {
  return {
    "X-API-Key": apiKey,
    "ngrok-skip-browser-warning": "1",   // otherwise ngrok's free tier returns its "you are about to visit" page
    ...(sessionToken ? { Authorization: `Bearer ${sessionToken}` } : {}),
    ...extra,
  };
}

async function checkHealth() {
  const dot = $("statusDot"), txt = $("statusText");
  if (!apiBase) { dot.className = "dot"; txt.textContent = "Not connected"; return; }
  dot.className = "dot"; txt.textContent = "Connecting…";
  try {
    const r = await fetch(apiBase + "/health", { headers: apiHeaders(), signal: AbortSignal.timeout(8000) });
    if (r.status === 401) {
      if (SERVED_BY_BACKEND) return goToLogin();   // session expired or logged out elsewhere
      dot.className = "dot bad"; txt.textContent = "Wrong key"; return;
    }
    if (!r.ok) throw new Error(r.status);
    dot.className = "dot ok"; txt.textContent = "Online";
  } catch {
    dot.className = "dot bad"; txt.textContent = "Offline";
  }
}

$("openSettings").onclick = () => {
  $("apiInput").value = apiBase;
  $("keyInput").value = apiKey;
  $("settings").showModal();
};
$("settings").addEventListener("close", () => {
  if ($("settings").returnValue === "save") setApi($("apiInput").value, $("keyInput").value);
});

// Show who's logged in, and offer a way out
async function loadUser() {
  if (!SERVED_BY_BACKEND || !sessionToken) return;
  try {
    const r = await fetch(apiBase + "/auth/me", { headers: apiHeaders() });
    if (r.status === 401) return goToLogin();
    const me = await r.json();
    firstName = me.profile?.first_name || "";
    $("userName").textContent = firstName || me.name;
    $("profile").hidden = false;
    $("logout").hidden = false;
    const greeting = document.querySelector("#welcome h1");   // welcome screen is already showing: add their name
    if (greeting) greeting.textContent = welcomeText();
    // Once the welcome note is settled (it may itself have woken the GPU), make sure the GPU is awake for their first question
    (me.profile && !me.profile.skipped ? loadWelcomeNote() : Promise.resolve()).then(warmUp);
    checkAnnouncements();
    setInterval(checkAnnouncements, 60 * 1000);   // new announcements show up within a minute for open tabs
  } catch {}   // server unreachable: the status light already says "Offline"
}

// Personalized 1-2 sentence greeting the model writes from the setup answers (server caches it per profile)
let welcomeNote = null;   // null = none, "" = still being written, otherwise the text
function renderWelcomeNote() {
  const el = document.querySelector("#welcome .welcome-note");
  if (!el) return;
  el.hidden = welcomeNote === null;
  if (welcomeNote === "") el.innerHTML = `<span class="typing"><span></span><span></span><span></span></span>`;
  else if (welcomeNote) el.textContent = welcomeNote;
}
async function loadWelcomeNote() {
  welcomeNote = "";
  renderWelcomeNote();
  try {
    const r = await fetch(apiBase + "/welcome", { method: "POST", headers: apiHeaders(), signal: AbortSignal.timeout(240000) });   // allows for the GPU waking up
    welcomeNote = (r.ok && (await r.json()).message) || null;
  } catch {
    welcomeNote = null;   // model busy or offline: just keep the generic welcome
  }
  renderWelcomeNote();
}
// The GPU sleeps when nobody's using it: start waking it now, while they read and type (the server skips this if it's already awake)
function warmUp() {
  fetch(apiBase + "/warmup", { method: "POST", headers: apiHeaders() }).catch(() => {});
}
$("profile").onclick = () => { location.href = SETUP_PAGE; };
$("logout").onclick = () => {
  // Log out locally first so this always works, even if the server is slow or unreachable; then tell the server
  const headers = apiHeaders();
  sessionToken = "";
  localStorage.removeItem("sfmate_session");
  fetch(apiBase + "/auth/logout", { method: "POST", headers, keepalive: true }).catch(() => {});
  location.replace(LOGIN_PAGE);
};
loadUser();

// ---------- rendering ----------
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Small markdown subset: paragraphs, bullet/numbered lists, **bold**, *italic*, `code`, [text](url), and [n] citations.
function renderMarkdown(text, sources) {
  const srcByN = Object.fromEntries((sources || []).map((s) => [s.n, s]));
  const inline = (s) => escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[(\d+)\]/g, (m, n) => !srcByN[n] ? m
      : srcByN[n].url   // Daily Announcements emails have no link: show the number with the title on hover
        ? `<sup><a href="${escapeHtml(srcByN[n].url)}" target="_blank" rel="noopener" title="${escapeHtml(srcByN[n].title)}">${n}</a></sup>`
        : `<sup title="${escapeHtml(srcByN[n].title)}">${n}</sup>`);

  const out = [];
  let list = null;   // { tag, items }
  const flush = () => { if (list) { out.push(`<${list.tag}>${list.items.map((i) => `<li>${i}</li>`).join("")}</${list.tag}>`); list = null; } };
  for (const block of text.split(/\n{2,}/)) {
    const lines = block.split("\n");
    if (lines.every((l) => /^\s*([-*•]|\d+[.)])\s+/.test(l) || !l.trim())) {
      for (const l of lines.filter((l) => l.trim())) {
        const tag = /^\s*\d+[.)]/.test(l) ? "ol" : "ul";
        if (!list || list.tag !== tag) { flush(); list = { tag, items: [] }; }
        list.items.push(inline(l.replace(/^\s*([-*•]|\d+[.)])\s+/, "")));
      }
    } else {
      flush();
      out.push(`<p>${lines.map(inline).join("<br>")}</p>`);
    }
  }
  flush();
  return out.join("");
}

function renderSources(sources) {
  // Several chunks often come from the same page — list each page once with all the citation numbers that point to it.
  const pages = new Map();
  for (const s of sources) {
    if (!pages.has(s.title)) pages.set(s.title, { ...s, nums: [] });
    pages.get(s.title).nums.push(s.n);
  }
  const items = [...pages.values()].map((p) => `<li>[${p.nums.join(", ")}] ${p.url
    ? `<a href="${escapeHtml(p.url)}" target="_blank" rel="noopener">${escapeHtml(p.title)}</a>`
    : escapeHtml(p.title)}</li>`).join("");
  return `<details class="sources"><summary>Sources (${pages.size})</summary><ul>${items}</ul></details>`;
}

function scrollToBottom() { scroller.scrollTop = scroller.scrollHeight; }

function addMessage(role, html) {
  $("welcome")?.remove();
  const row = document.createElement("div");
  row.className = `msg ${role}`;
  row.innerHTML = role === "bot"
    ? `<div class="avatar" role="img" aria-label="sfMate"></div><div class="bubble">${html}</div>`
    : `<div class="bubble"></div>`;
  if (role === "user") row.querySelector(".bubble").textContent = html;
  thread.appendChild(row);
  scrollToBottom();
  return row.querySelector(".bubble");
}

function welcomeText() {
  return firstName ? `Hey ${firstName}, I'm sfMate 👋` : "Hey, I'm sfMate 👋";
}

function showWelcome() {
  thread.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="welcome-knight" role="img" aria-label="sfMate"></div>
      <h1>${escapeHtml(welcomeText())}</h1>
      <div class="welcome-note" hidden></div>
      <p>Ask me about classes, rules, events, tuition — anything on sfhs.com or in the Student-Parent Handbook.</p>
      <div class="suggestions">${SUGGESTIONS.map((s) => `<button class="suggestion">${escapeHtml(s)}</button>`).join("")}</div>
    </div>`;
  thread.querySelectorAll(".suggestion").forEach((b) => (b.onclick = () => send(b.textContent)));
  renderWelcomeNote();
}

// ---------- sending ----------
function setBusy(busy) {
  sendBtn.textContent = busy ? "■" : "➤";
  sendBtn.title = busy ? "Stop" : "Send";
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  if (!apiBase) { $("openSettings").click(); return; }
  // A short "yes" / "nah" right after "Daily announcements are out…" answers that question
  if (pendingAnnouncement && text.length <= 40) {
    if (ANNOUNCE_YES.test(text)) return summarizeAnnouncements(text);
    if (ANNOUNCE_NO.test(text)) return declineAnnouncements(text);
  }
  input.value = ""; autosize();
  await streamReply("/chat", { message: text, history: history.slice(-HISTORY_TURNS) }, text, text);
}

// Shows `shownText` as the user's message, streams the server's answer from `path` into a new bot bubble,
// and remembers the exchange (with `historyText` as the user's side) so follow-up questions have context.
async function streamReply(path, body, shownText, historyText) {
  addMessage("user", shownText);
  const bubble = addMessage("bot", `<span class="typing"><span></span><span></span><span></span></span>`);
  // The GPU sleeps when nobody's using it; the first question after a break waits while it starts up
  const wakingNote = setTimeout(() => {
    if (!answer) bubble.innerHTML = `<span class="typing"><span></span><span></span><span></span></span>
      <p class="waking">Waking up sfMate's brain… the first question after a quiet spell can take a minute or two.</p>`;
  }, 6000);

  controller = new AbortController();
  setBusy(true);
  let answer = "", sources = [];

  try {
    const res = await fetch(apiBase + path, {
      method: "POST",
      headers: apiHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    if (res.status === 401) {
      if (SERVED_BY_BACKEND) { goToLogin(); return; }
      throw new Error("wrong access key — check ⚙️");
    }
    if (!res.ok) {
      const detail = (await res.json().catch(() => ({}))).detail;
      const err = new Error(typeof detail === "string" ? detail : `Server returned ${res.status}`);
      err.limitReached = res.status === 429;
      throw err;
    }

    // Read the Server-Sent Events stream: {sources} first, then {delta} tokens, then {done}
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let sep;
      while ((sep = buf.indexOf("\n\n")) >= 0) {
        const event = buf.slice(0, sep);
        buf = buf.slice(sep + 2);
        for (const line of event.split("\n")) {
          if (!line.startsWith("data: ")) continue;
          const msg = JSON.parse(line.slice(6));
          if (msg.sources) sources = msg.sources;
          if (msg.delta) { answer += msg.delta; bubble.innerHTML = renderMarkdown(answer, sources); scrollToBottom(); }
          if (msg.error) throw new Error(msg.error);
        }
      }
    }
    if (!answer) throw new Error("Empty response from the model.");
    bubble.innerHTML = renderMarkdown(answer, sources) + (sources.length ? renderSources(sources) : "");
    history.push({ role: "user", content: historyText }, { role: "assistant", content: answer });
  } catch (err) {
    if (err.name === "AbortError") {
      bubble.innerHTML = answer ? renderMarkdown(answer, sources) + "<p><em>(stopped)</em></p>" : "<p><em>(stopped)</em></p>";
      if (answer) history.push({ role: "user", content: historyText }, { role: "assistant", content: answer });
    } else {
      bubble.classList.add("error");
      bubble.innerHTML = err.limitReached   // daily message cap: the server's message says it all
        ? `<p>${escapeHtml(err.message)}</p>`
        : `<p>Couldn't reach sfMate: ${escapeHtml(err.message)}</p>
           <p>${SERVED_BY_BACKEND
             ? "sfMate's server might be restarting. Wait a moment, then refresh this page."
             : "Check that the server URL in ⚙️ is right."}</p>`;
      checkHealth();
    }
  } finally {
    clearTimeout(wakingNote);
    controller = null;
    setBusy(false);
    scrollToBottom();
    input.focus();
  }
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (controller) controller.abort();
  else send(input.value);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (!controller) send(input.value);   // Enter never stops a reply; only the ■ button does
  }
});
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
input.addEventListener("input", autosize);

// ---------- Daily Announcements ----------
// The server says when today's announcements are in and this user hasn't answered yet; we ask once per email.
let pendingAnnouncement = null;   // {id, date, message} while the Yes / No question is open
let shownAnnouncementId = "";
const ANNOUNCE_YES = /^(y|ya|yah|yea|yeah|yes|yep|yup|sure|ok|okay|k|please|pls|bet|do it|go ahead|summarize)\b/i;
const ANNOUNCE_NO = /^(n|no|nah|nope|not now|no thanks|later|pass)\b/i;

async function checkAnnouncements() {
  if (!SERVED_BY_BACKEND || !sessionToken) return;
  try {
    const r = await fetch(apiBase + "/announcements/status", { headers: apiHeaders() });
    if (r.status === 401) return goToLogin();
    const s = await r.json();
    if (s.available && s.id !== shownAnnouncementId) showAnnouncementPrompt(s);
  } catch {}   // offline for a moment: try again next minute
}

function showAnnouncementPrompt(s) {
  shownAnnouncementId = s.id;
  pendingAnnouncement = s;
  const row = document.createElement("div");
  row.className = "msg bot";
  row.innerHTML = `<div class="avatar" role="img" aria-label="sfMate"></div>
    <div class="bubble"><p>${escapeHtml(s.message)}</p>
      <div class="announce-actions">
        <button type="button" class="announce-yes">Yes, summarize</button>
        <button type="button" class="announce-no">No thanks</button>
      </div></div>`;
  row.querySelector(".announce-yes").onclick = () => summarizeAnnouncements("Yes");
  row.querySelector(".announce-no").onclick = () => declineAnnouncements("No thanks");
  thread.appendChild(row);   // added below the welcome screen rather than replacing it
  scrollToBottom();
}

function closeAnnouncementPrompt() {
  pendingAnnouncement = null;
  document.querySelectorAll(".announce-actions button").forEach((b) => (b.disabled = true));
}

async function summarizeAnnouncements(shownText) {
  const a = pendingAnnouncement;
  if (!a || controller) return;   // already answered, or another reply is still streaming
  closeAnnouncementPrompt();
  input.value = ""; autosize();
  await streamReply("/announcements/summary", { id: a.id }, shownText, `Summarize the Daily Announcements from ${a.date}.`);
}

function declineAnnouncements(shownText) {
  const a = pendingAnnouncement;
  if (!a) return;
  closeAnnouncementPrompt();
  input.value = ""; autosize();
  fetch(apiBase + "/announcements/dismiss", {
    method: "POST", headers: apiHeaders({ "Content-Type": "application/json" }), body: JSON.stringify({ id: a.id }),
  }).catch(() => {});
  addMessage("user", shownText);
  addMessage("bot", "<p>No worries. If you change your mind, just ask me what's in today's announcements.</p>");
}

$("newChat").onclick = () => {
  if (controller) controller.abort();
  history = [];
  showWelcome();
  if (pendingAnnouncement) showAnnouncementPrompt(pendingAnnouncement);   // still unanswered: keep asking
  input.focus();
};

showWelcome();
</script>
</body>
</html>
